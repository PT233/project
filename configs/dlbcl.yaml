dataset: dlbcl
data_root: H:/1.MasterDegree/17.RD/project
split_dir: data/splits/
split_files:
  train: dlbcl_survival_train.csv
  val: dlbcl_survival_val.csv
  test: dlbcl_survival_test.csv

model: efficientnet_b2
pretrained: true
num_classes: 2

batch_size: 16
lr: 5.0e-5
weight_decay: 5.0e-4
