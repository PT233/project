stain_reference_path: data/stain_reference.png
label_smoothing: 0.1
early_stop_patience: 5
patient_aggregation: max
checkpoint_name: best_dlbcl.pth

wandb:
  project: cancer-histo-dlbcl
  entity: YOUR_WANDB_ENTITY
